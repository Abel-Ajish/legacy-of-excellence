*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; overflow: hidden; height: 100vh; }
#toolbar { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: var(--panel); border-bottom: 1px solid var(--border); padding: 8px 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip { padding: 4px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; border: 1px solid var(--border); background: var(--panel-2); color: var(--muted); transition: all 0.2s; user-select: none; }
.chip:hover { border-color: var(--accent); color: var(--text); }
.chip.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
.chip-critical { border-color: var(--critical); }
.chip-critical.active { background: var(--critical); border-color: var(--critical); }
#controls { position: fixed; bottom: 16px; right: 16px; z-index: 100; display: flex; gap: 6px; }
#controls button { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
#controls button:hover { background: var(--panel-2); border-color: var(--accent); }
#canvas-wrap { position: absolute; top: 48px; left: 0; right: 320px; bottom: 0; overflow: hidden; cursor: grab; }
#canvas-wrap.grabbing { cursor: grabbing; }
#canvas { transform-origin: 0 0; }
#sidebar { position: fixed; top: 48px; right: 0; bottom: 0; width: 320px; background: var(--panel); border-left: 1px solid var(--border); overflow-y: auto; padding: 20px; font-size: 13px; line-height: 1.5; }
#sidebar h3 { font-size: 15px; margin-bottom: 6px; color: var(--text); }
#sidebar .path { font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: 11px; color: var(--accent); background: var(--panel-2); padding: 4px 8px; border-radius: 4px; display: inline-block; margin-bottom: 10px; word-break: break-all; }
#sidebar .role { color: var(--text); margin-bottom: 4px; }
#sidebar .plain { color: var(--muted); margin-bottom: 10px; font-size: 12px; }
#sidebar .notes { list-style: none; padding: 0; margin-bottom: 12px; }
#sidebar .notes li { padding: 3px 0; color: var(--muted); font-size: 12px; }
#sidebar .notes li::before { content: '→ '; color: var(--accent); }
#sidebar .edge-list { margin-bottom: 12px; }
#sidebar .edge-item { font-size: 11px; padding: 3px 0; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.edge-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
#sidebar .findings { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }
#sidebar .findings h4 { font-size: 13px; color: var(--accent); margin-bottom: 8px; }
#sidebar .findings p, #sidebar .findings li { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
#sidebar .findings ul { padding-left: 14px; }
.badge { position: absolute; width: 18px; height: 18px; border-radius: 50%; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.badge-fix { background: #16a34a; color: #fff; top: -4px; right: -4px; }
.badge-bug { background: var(--critical); color: #fff; top: -4px; right: -4px; }
</style>
</head>

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function buildSVG() {
  const W = 1590, H = 1260;
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = '';

  defs.innerHTML = `
    <marker id="arrow-normal" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="var(--muted)" stroke-width="1"/>
    </marker>
    <marker id="arrow-critical" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="var(--critical)" stroke-width="1.2"/>
    </marker>
    <marker id="arrow-api" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="var(--accent-2)" stroke-width="1"/>
    </marker>
    <marker id="arrow-db" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="var(--db)" stroke-width="1"/>
    </marker>
    <marker id="arrow-mount" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#5cc8ff" stroke-width="1"/>
    </marker>
  `;
  svg.appendChild(defs);

  // Clusters
  clusters.forEach(c => {
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('data-cluster', c.id);
    const col = getComputedStyle(document.documentElement).getPropertyValue(c.color).trim();
    g.innerHTML = `
      <rect x="${c.x}" y="${c.y}" width="${c.w}" height="${c.h}" rx="12" fill="none" stroke="${col}" stroke-opacity="0.15" stroke-width="1"/>
      <text x="${c.x + 12}" y="${c.y + 20}" fill="${col}" fill-opacity="0.5" font-size="11" font-weight="600">${esc(c.label)}</text>
    `;
    svg.appendChild(g);
  });

  // Edges
  const nodeMap = {};
  nodes.forEach(n => nodeMap[n.id] = n);

  edges.forEach((e, i) => {
    const from = nodeMap[e.from], to = nodeMap[e.to];
    if (!from || !to) return;
    const x1 = from.x + from.w, y1 = from.y + from.h / 2;
    const x2 = to.x, y2 = to.y + to.h / 2;
    const cx1 = x1 + (x2 - x1) * 0.4;
    const cx2 = x2 - (x2 - x1) * 0.4;
    const color = e.kind === 'critical' ? 'var(--critical)' :
                  e.kind === 'api' ? 'var(--accent-2)' :
                  e.kind === 'db' ? 'var(--db)' :
                  e.kind === 'mount' ? '#5cc8ff' : 'var(--muted)';
    const opacity = e.kind === 'critical' ? 0.8 : 0.35;
    const strokeW = e.kind === 'critical' ? 1.8 : 1;

    const path = document.createElementNS('http://www.w3.org/2000/svg','g');
    path.setAttribute('data-edge', `${e.from}-${e.to}`);
    path.setAttribute('data-tag', e.tag.join(','));
    path.innerHTML = `
      <path d="M${x1} ${y1} C${cx1} ${y1}, ${cx2} ${y2}, ${x2} ${y2}"
        fill="none" stroke="${color}" stroke-opacity="${opacity}" stroke-width="${strokeW}"
        marker-end="url(#arrow-${e.kind})"/>
    `;
    // Label
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2 - 6;
    const labelG = document.createElementNS('http://www.w3.org/2000/svg','g');
    labelG.setAttribute('data-edge-label', `${e.from}-${e.to}`);
    labelG.setAttribute('data-tag', e.tag.join(','));
    const labelBg = document.createElementNS('http://www.w3.org/2000/svg','rect');
    const labelText = document.createElementNS('http://www.w3.org/2000/svg','text');
    labelText.textContent = e.label;
    labelText.setAttribute('x', mx);
    labelText.setAttribute('y', my + 3);
    labelText.setAttribute('text-anchor', 'middle');
    labelText.setAttribute('fill', color);
    labelText.setAttribute('fill-opacity', '0.7');
    labelText.setAttribute('font-size', '8');
    labelText.setAttribute('font-family', "'Cascadia Code','Fira Code',monospace");
    const bbox = { w: e.label.length * 4.5 + 8, h: 14 };
    labelBg.setAttribute('x', mx - bbox.w / 2);
    labelBg.setAttribute('y', my - 8);
    labelBg.setAttribute('width', bbox.w);
    labelBg.setAttribute('height', bbox.h);
    labelBg.setAttribute('rx', 3);
    labelBg.setAttribute('fill', 'var(--bg)');
    labelBg.setAttribute('fill-opacity', '0.85');
    labelG.appendChild(labelBg);
    labelG.appendChild(labelText);
    svg.appendChild(path);
    svg.appendChild(labelG);
  });

  // Nodes
  nodes.forEach(n => {
    const col = getComputedStyle(document.documentElement).getPropertyValue(n.color).trim();
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('data-node', n.id);
    g.setAttribute('data-tag', n.tag.join(','));
    g.style.cursor = 'pointer';

    const strokeW = n.critical ? 2.2 : 1.2;
    const isDead = n.sub && n.sub.includes('DEAD');

    let badgeHTML = '';
    if (FIXES[n.id]) badgeHTML += `<circle cx="${n.x + n.w - 6}" cy="${n.y + 6}" r="8" fill="#16a34a"/><text x="${n.x + n.w - 6}" y="${n.y + 10}" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">${FIXES[n.id].length}</text>`;
    if (KNOWN_BUGS[n.id]) badgeHTML += `<circle cx="${n.x + n.w - 6}" cy="${n.y + (FIXES[n.id] ? 20 : 6)}" r="8" fill="var(--critical)"/><text x="${n.x + n.w - 6}" y="${n.y + (FIXES[n.id] ? 24 : 10)}" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">${KNOWN_BUGS[n.id].length}</text>`;

    g.innerHTML = `
      <rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="8"
        fill="var(--panel-2)" stroke="${isDead ? '#666' : col}" stroke-width="${strokeW}"
        stroke-opacity="${isDead ? 0.4 : 1}"/>
      <text x="${n.x + 10}" y="${n.y + 17}" fill="${isDead ? '#888' : col}" font-size="11" font-weight="600">${esc(n.label)}</text>
      <text x="${n.x + 10}" y="${n.y + 33}" fill="${isDead ? '#666' : 'var(--muted)'}" font-size="9">${esc(n.sub)}</text>
      ${badgeHTML}
    `;
    g.addEventListener('mouseenter', () => selectNode(n.id));
    g.addEventListener('click', () => selectNode(n.id));
    svg.appendChild(g);
  });
}

function selectNode(id) {
  selectedNode = id;
  const n = nodes.find(x => x.id === id);
  if (!n) return;

  // Dim unconnected
  const connected = new Set([id]);
  edges.forEach(e => {
    if (e.from === id) connected.add(e.to);
    if (e.to === id) connected.add(e.from);
  });

  svg.querySelectorAll('[data-node]').forEach(g => {
    const nid = g.getAttribute('data-node');
    g.style.opacity = connected.has(nid) ? '1' : '0.15';
  });
  svg.querySelectorAll('[data-edge]').forEach(g => {
    const tags = g.getAttribute('data-tag');
    g.style.opacity = '1';
  });
  svg.querySelectorAll('[data-edge-label]').forEach(g => {
    g.style.opacity = '0.3';
  });
  // Show labels for connected edges
  edges.forEach(e => {
    if (e.from === id || e.to === id) {
      const lbl = svg.querySelector(`[data-edge-label="${e.from}-${e.to}"]`);
      if (lbl) lbl.style.opacity = '1';
    }
  });

  showSidebar(n);
}

function clearSelection() {
  selectedNode = null;
  svg.querySelectorAll('[data-node]').forEach(g => g.style.opacity = '1');
  svg.querySelectorAll('[data-edge]').forEach(g => {
    const tags = g.getAttribute('data-tag');
    g.style.opacity = tags.includes(activeTag) ? '1' : '0.06';
  });
  svg.querySelectorAll('[data-edge-label]').forEach(g => {
    const tags = g.getAttribute('data-tag');
    g.style.opacity = tags.includes(activeTag) ? '0.7' : '0.06';
  });
  showSidebar(null);
}

function showSidebar(n) {
  if (!n) {
    // Default view with notable findings
    sidebarContent.innerHTML = `
      <h3>Legacy Site — Architecture Overview</h3>
      <p class="role" style="margin-top:8px;">Next.js 16 tribute website for Mrs. Molly Treasa Mammen</p>
      <p class="plain" style="margin-top:8px;">A single-page memorial site with a message submission system, admin moderation panel, and push notifications for new messages.</p>
      <div class="findings">
        <h4>Fixes Applied</h4>
        <ul>
          <li><strong>Race condition fixed:</strong> updateMessageStatus now uses atomic PATCH with updateMask.</li>
          <li><strong>Timing-safe password:</strong> Admin password comparison uses crypto.timingSafeEqual.</li>
          <li><strong>XSS fixed:</strong> moderate/route.ts now escapes user input in HTML responses.</li>
          <li><strong>timingSafeEqual:</strong> Buffer length check added before comparison.</li>
          <li><strong>Image optimization:</strong> Portrait uses next/image with priority for faster loading.</li>
        </ul>
      </div>
      <div class="findings" style="margin-top:16px;">
        <h4>Remaining Notes</h4>
        <ul>
          <li><strong>Dead code:</strong> FarewellLetter.tsx is exported but never imported.</li>
          <li><strong>Unused dependency:</strong> gsap is in package.json but never imported.</li>
          <li><strong>No Firebase Admin SDK:</strong> Uses raw REST API with API key.</li>
        </ul>
      </div>
      <div class="findings" style="margin-top:16px;">
        <h4>Critical Path</h4>
        <p style="color:var(--critical);">home → MessageForm → POST /api/messages → firebase.addMessage() → Firestore → webhook.sendWebhook() → ntfy.sh</p>
      </div>
      <div class="findings" style="margin-top:16px;">
        <h4>Filter chips</h4>
        <p>Use the chips at the top to filter by feature. "Critical Path" highlights the message submission flow.</p>
      </div>
    `;
    return;
  }

  const incoming = edges.filter(e => e.to === n.id);
  const outgoing = edges.filter(e => e.from === n.id);

  const colorVar = n.color;
  const colorHex = getComputedStyle(document.documentElement).getPropertyValue(colorVar).trim();

  let notesHTML = (n.notes || []).map(ni => `<li>${esc(ni)}</li>`).join('');

  let fixesHTML = '';
  if (FIXES[n.id]) {
    fixesHTML = `<div class="findings"><h4>Fixes</h4><ul>${FIXES[n.id].map(f => `<li>#${f.n}: ${esc(f.t)}</li>`).join('')}</ul></div>`;
  }
  let bugsHTML = '';
  if (KNOWN_BUGS[n.id]) {
    bugsHTML = `<div class="findings"><h4 style="color:var(--critical)">Known Bugs</h4><ul>${KNOWN_BUGS[n.id].map(b => `<li>[${b.sev}] ${b.ref ? b.ref + ': ' : ''}${esc(b.t)}</li>`).join('')}</ul></div>`;
  }

  const renderEdges = (list, dir) => list.map(e => {
    const other = dir === 'in' ? e.from : e.to;
    const otherNode = nodes.find(x => x.id === other);
    const kindColor = e.kind === 'critical' ? 'var(--critical)' :
                      e.kind === 'api' ? 'var(--accent-2)' :
                      e.kind === 'db' ? 'var(--db)' :
                      e.kind === 'mount' ? '#5cc8ff' : 'var(--muted)';
    return `<div class="edge-item"><span class="edge-dot" style="background:${kindColor}"></span>${dir === 'in' ? '←' : '→'} ${otherNode ? otherNode.label : other}: ${esc(e.label)}</div>`;
  }).join('');

  sidebarContent.innerHTML = `
    <h3>${esc(n.label)}</h3>
    <div class="path">${esc(n.path || '')}</div>
    <div class="role">${esc(n.role)}</div>
    <div class="plain">${esc(n.plain)}</div>
    <ul class="notes">${notesHTML}</ul>
    ${incoming.length ? `<div style="font-size:11px;color:var(--text);font-weight:600;margin-bottom:4px;">Incoming (${incoming.length})</div><div class="edge-list">${renderEdges(incoming, 'in')}</div>` : ''}
    ${outgoing.length ? `<div style="font-size:11px;color:var(--text);font-weight:600;margin-bottom:4px;">Outgoing (${outgoing.length})</div><div class="edge-list">${renderEdges(outgoing, 'out')}</div>` : ''}
    ${fixesHTML}
    ${bugsHTML}
  `;
}

// ── Pan / Zoom ──
function applyTransform() {
  svg.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
}

wrap.addEventListener('mousedown', e => {
  if (e.target === wrap || e.target === svg) {
    isPanning = true;
    panStart = { x: e.clientX - tx, y: e.clientY - ty };
    wrap.classList.add('grabbing');
  }
});
window.addEventListener('mousemove', e => {
  if (!isPanning) return;
  tx = e.clientX - panStart.x;
  ty = e.clientY - panStart.y;
  applyTransform();
});
window.addEventListener('mouseup', () => {
  isPanning = false;
  wrap.classList.remove('grabbing');
});
wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = wrap.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  const newScale = Math.max(0.15, Math.min(5, scale * delta));
  tx = mx - (mx - tx) * (newScale / scale);
  ty = my - (my - ty) * (newScale / scale);
  scale = newScale;
  applyTransform();
}, { passive: false });

// Click background to clear
wrap.addEventListener('click', e => {
  if (e.target === wrap || e.target === svg) clearSelection();
});

// Controls
document.getElementById('btn-fit').addEventListener('click', () => {
  const rect = wrap.getBoundingClientRect();
  const svgW = parseFloat(svg.getAttribute('width'));
  const svgH = parseFloat(svg.getAttribute('height'));
  const scaleX = rect.width / svgW;
  const scaleY = rect.height / svgH;
  scale = Math.min(scaleX, scaleY) * 0.95;
  tx = (rect.width - svgW * scale) / 2;
  ty = (rect.height - svgH * scale) / 2;
  applyTransform();
});
document.getElementById('btn-in').addEventListener('click', () => {
  const rect = wrap.getBoundingClientRect();
  const cx = rect.width / 2, cy = rect.height / 2;
  const newScale = Math.min(5, scale * 1.3);
  tx = cx - (cx - tx) * (newScale / scale);
  ty = cy - (cy - ty) * (newScale / scale);
  scale = newScale;
  applyTransform();
});
document.getElementById('btn-out').addEventListener('click', () => {
  const rect = wrap.getBoundingClientRect();
  const cx = rect.width / 2, cy = rect.height / 2;
  const newScale = Math.max(0.15, scale / 1.3);
  tx = cx - (cx - tx) * (newScale / scale);
  ty = cy - (cy - ty) * (newScale / scale);
  scale = newScale;
  applyTransform();
});

// ── Filter Chips ──
const chipTags = [
  { id: 'overview', label: 'Overview', cls: '' },
  { id: 'messages', label: 'Messages', cls: '' },
  { id: 'admin', label: 'Admin', cls: '' },
  { id: 'gallery', label: 'Gallery', cls: '' },
  { id: 'critical', label: 'Critical Path', cls: 'chip-critical' },
  { id: 'all', label: 'Show All Wires', cls: '' },
];

const toolbar = document.getElementById('toolbar');
chipTags.forEach(ct => {
  const chip = document.createElement('span');
  chip.className = `chip ${ct.cls}` + (ct.id === 'overview' ? ' active' : '');
  chip.textContent = ct.label;
  chip.addEventListener('click', () => {
    toolbar.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeTag = ct.id;
    applyFilter(ct.id);
  });
  toolbar.appendChild(chip);
});

function applyFilter(tag) {
  clearSelection();

  if (tag === 'critical') {
    // Show only critical path nodes and edges
    svg.querySelectorAll('[data-node]').forEach(g => {
      const nid = g.getAttribute('data-node');
      const node = nodes.find(x => x.id === nid);
      g.style.opacity = node && node.critical ? '1' : '0.08';
    });
    svg.querySelectorAll('[data-edge]').forEach(g => {
      g.style.opacity = '0.06';
    });
    svg.querySelectorAll('[data-edge-label]').forEach(g => {
      g.style.opacity = '0.06';
    });
    // Now show critical edges
    edges.forEach(e => {
      if (e.kind === 'critical') {
        const pathEl = svg.querySelector(`[data-edge="${e.from}-${e.to}"]`);
        const labelEl = svg.querySelector(`[data-edge-label="${e.from}-${e.to}"]`);
        if (pathEl) pathEl.style.opacity = '1';
        if (labelEl) labelEl.style.opacity = '1';
      }
    });
    return;
  }

  if (tag === 'all') {
    svg.querySelectorAll('[data-node]').forEach(g => g.style.opacity = '1');
    svg.querySelectorAll('[data-edge]').forEach(g => g.style.opacity = '1');
    svg.querySelectorAll('[data-edge-label]').forEach(g => g.style.opacity = '0.7');
    return;
  }

  // Tag filter: show nodes with this tag, dim others
  svg.querySelectorAll('[data-node]').forEach(g => {
    const tags = g.getAttribute('data-tag');
    g.style.opacity = tags.includes(tag) ? '1' : '0.08';
  });
  svg.querySelectorAll('[data-edge]').forEach(g => {
    const tags = g.getAttribute('data-tag');
    g.style.opacity = tags.includes(tag) ? '1' : '0.06';
  });
  svg.querySelectorAll('[data-edge-label]').forEach(g => {
    const tags = g.getAttribute('data-tag');
    g.style.opacity = tags.includes(tag) ? '0.7' : '0.06';
  });
}

// ── Init ──
buildSVG();
clearSelection();
// Auto-fit on load
setTimeout(() => document.getElementById('btn-fit').click(), 100);
</script>
